<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Steps 排順序</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Bubble Fun — shared styles (soft pastel) */
:root{
  --bg:#FFF8F1;
  --ink:#5B4A5E;
  --ink-soft:#8C7A8F;
  --pink:#F9C9D6;
  --pink-deep:#EE9DB4;
  --mint:#C3E9D9;
  --mint-deep:#86CDB0;
  --lav:#DCD0F4;
  --lav-deep:#B39DE3;
  --sky:#C6E2F7;
  --sky-deep:#8EC1E8;
  --butter:#FCEBB0;
  --butter-deep:#F3D06B;
  --peach:#FDD9C1;
  --peach-deep:#F5AE84;
  --card:#FFFFFF;
  --shadow:0 6px 0 rgba(91,74,94,.08), 0 10px 24px rgba(91,74,94,.08);
  /* game colors: soft but clearly recognisable */
  --c-red:#F0767B;
  --c-orange:#F7A456;
  --c-yellow:#F5CF4E;
  --c-green:#79C27E;
  --c-blue:#6DA6DD;
  --c-purple:#A88AD8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Fredoka","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;
  min-height:100vh;
}
a{color:inherit}
button{font-family:inherit;color:inherit;cursor:pointer}
.zh{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}

/* ---------- bubbles ---------- */
.bg-bubbles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bgb{position:absolute;bottom:-120px;opacity:.7;animation:rise linear infinite}
.bgb svg{display:block}
@keyframes rise{
  0%{transform:translate(0,0) rotate(0)}
  25%{transform:translate(18px,-28vh) rotate(6deg)}
  50%{transform:translate(-14px,-56vh) rotate(-4deg)}
  75%{transform:translate(16px,-84vh) rotate(5deg)}
  100%{transform:translate(0,-125vh) rotate(0)}
}
.bub{display:block}
.bub svg{display:block;width:100%;height:100%}
.ic{width:1.2em;height:1.2em;vertical-align:-.25em;display:inline-block}
.ic.big{width:1em;height:1em;vertical-align:middle}
.ic.off{filter:grayscale(1);opacity:.28}

/* ---------- common UI ---------- */
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:24px 16px 48px}
.btn{
  border:none;border-radius:999px;padding:.6em 1.3em;font-size:1.05rem;font-weight:600;
  background:var(--card);box-shadow:var(--shadow);transition:transform .12s;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(2px) scale(.98)}
.btn.pink{background:var(--pink)} .btn.mint{background:var(--mint)}
.btn.lav{background:var(--lav)} .btn.sky{background:var(--sky)}
.btn.butter{background:var(--butter)} .btn.peach{background:var(--peach)}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topbar .spacer{flex:1}
.home-link{text-decoration:none;font-weight:600;background:var(--card);border-radius:999px;padding:.45em 1em;box-shadow:var(--shadow)}

/* ---------- hand-drawn art ---------- */
.art{position:relative;display:inline-block;width:6em;height:4.6em;font-size:1rem;line-height:1}
.art svg{width:100%;height:100%;overflow:visible;display:block}
.art g[class^="an-"]{transform-box:fill-box;transform-origin:center}
.an-blow{animation:blowOut 2.4s ease-out infinite}
.an-blow.b2{animation-delay:.8s}.an-blow.b3{animation-delay:1.6s}
@keyframes blowOut{0%{transform:translate(18px,8px) scale(.25);opacity:0}20%{opacity:1}80%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(-4px,-4px) scale(1);opacity:0}}
.an-pop{animation:popIt 2s ease-in infinite}
.an-boom{animation:boom 2s ease-out infinite}
@keyframes popIt{0%{transform:scale(.85)}55%{transform:scale(1.12);opacity:1}62%{transform:scale(1.3);opacity:0}92%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(.85)}}
@keyframes boom{0%,55%{opacity:0;transform:scale(.5)}66%{opacity:1;transform:scale(1.05)}90%{opacity:1}100%{opacity:0;transform:scale(1.15)}}
.an-float{animation:floatUp 3s ease-in-out infinite}
@keyframes floatUp{0%{transform:translate(0,10px)}50%{transform:translate(4px,-2px)}100%{transform:translate(-2px,10px)}}
.an-fly{animation:flyBy 2.2s ease-in-out infinite}
@keyframes flyBy{0%{transform:translate(-14px,4px)}50%{transform:translate(8px,-4px)}100%{transform:translate(-14px,4px)}}
.an-land{animation:landHand 2.4s ease-in-out infinite}
@keyframes landHand{0%{transform:translateY(-14px)}55%,100%{transform:translateY(0)}}
.an-stir{animation:stir 1.1s ease-in-out infinite;transform-origin:0% 100%!important}
@keyframes stir{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
.an-dip{animation:dip 1.8s ease-in-out infinite}
@keyframes dip{0%,100%{transform:translateY(-8px)}50%{transform:translateY(4px)}}
.an-drop{animation:dropIn 1.6s ease-in infinite}
@keyframes dropIn{0%{transform:translateY(-8px);opacity:0}25%{opacity:1}80%{transform:translateY(12px);opacity:1}100%{transform:translateY(14px);opacity:0}}
.an-bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.an-cap{animation:capWiggle 1.4s ease-in-out infinite}
@keyframes capWiggle{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(2px,-4px) rotate(8deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-iteration-count:1!important}}

/* ---------- game shell ---------- */
.game-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.game-head h1{margin:0;font-size:clamp(1.4rem,3.5vw,2.2rem)}
.pill{background:var(--card);border-radius:999px;padding:.35em .9em;font-weight:600;box-shadow:var(--shadow)}
.panel{background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:clamp(16px,3vw,32px)}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:18px}
.level{border:none;border-radius:24px;padding:22px 18px;text-align:left;box-shadow:var(--shadow);transition:transform .12s}
.level:hover{transform:translateY(-3px) rotate(-.5deg)}
.level .t{font-size:1.5rem;font-weight:700}
.level .s{margin-top:6px;color:var(--ink-soft);font-size:.95rem;line-height:1.45}
.level.l1{background:var(--mint)} .level.l2{background:var(--butter)}
.level.l3{background:var(--peach)} .level.l4{background:var(--lav)}
.hidden{display:none!important}
.result{text-align:center}
.result .stars{font-size:clamp(3rem,10vw,5rem);letter-spacing:.1em}

.result .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.bounce{animation:bounce .4s}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.speak-btn{border:none;background:var(--sky);border-radius:50%;width:2.6em;height:2.6em;font-size:1.3rem;box-shadow:var(--shadow)}
.timer{font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;top:18%;transform:translate(-50%,0);font-size:clamp(2rem,7vw,4rem);font-weight:700;pointer-events:none;z-index:50;
  animation:toast 0.9s ease-out forwards;text-shadow:0 3px 0 #fff}
@keyframes toast{0%{opacity:0;transform:translate(-50%,20px) scale(.7)}25%{opacity:1;transform:translate(-50%,0) scale(1.05)}100%{opacity:0;transform:translate(-50%,-30px) scale(1)}}

/* music toggle */
#bf-music{position:fixed;right:16px;bottom:16px;z-index:60;width:54px;height:54px;border:none;border-radius:50%;
  background:var(--butter);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;transition:transform .15s}
#bf-music .ic{width:30px;height:30px;vertical-align:0}
#bf-music:not(.off) .ic{animation:noteBob 1.3s ease-in-out infinite}
@keyframes noteBob{0%,100%{transform:rotate(-8deg) translateY(0)}50%{transform:rotate(8deg) translateY(-3px)}}
#bf-music.off{background:#fff;opacity:.75}
#bf-music .slash{position:absolute;width:38px;height:4px;background:var(--pink-deep);border-radius:2px;transform:rotate(-40deg)}
#bf-music:hover{transform:scale(1.06)}
@media print{#bf-music{display:none!important}}

</style>
<style>
  .task{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  .task h2{margin:0;font-size:clamp(1.5rem,4vw,2.4rem)}
  .slots{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:14px;margin:10px 0 22px}
  .slot{position:relative;min-height:190px;border:4px dashed var(--lav-deep);border-radius:24px;background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center}
  .slot .n{position:absolute;top:-16px;left:-10px;width:40px;height:40px;border-radius:50%;background:var(--lav-deep);color:#fff;font-weight:700;font-size:1.3rem;display:flex;align-items:center;justify-content:center;z-index:2}
  .slot.ok{border-style:solid;border-color:var(--mint-deep);background:var(--mint)}
  .slot.no{border-style:solid;border-color:var(--pink-deep)}
  .pool{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;min-height:200px;background:var(--card);border-radius:28px;padding:18px;box-shadow:var(--shadow)}
  .card{border:none;background:var(--butter);border-radius:22px;padding:12px 14px;min-width:160px;max-width:220px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:var(--shadow);transition:transform .12s}
  .card:hover{transform:translateY(-3px)}
  .card .art{font-size:18px}
  .card .w{font-size:1.35rem;font-weight:600;line-height:1.2}
  .slot .card{box-shadow:none;margin:6px;width:calc(100% - 12px)}
  .card.textonly{min-height:90px;justify-content:center;background:var(--peach)}
  .hint{color:var(--ink-soft);margin:8px 0 0;text-align:center}
  @media (max-width:700px){.slots{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="game-head">
    <a class="home-link" href="index.html">🏠 Home</a>
    <h1>Steps 排順序</h1>
    <span style="flex:1"></span>
    <span class="pill hidden" id="lvl"></span>
    <span class="pill hidden" id="round"></span>
    <span class="pill timer hidden" id="timer"></span>
  </div>

  <div class="panel" id="select">
    <div class="zh" style="font-size:1.15rem">點卡片，照順序放進 1、2、3、4。點放好的卡片可以拿回來。</div>
    <div class="levels">
      <button class="level l1" data-lv="easy"><div class="t">⭐ 簡單 Easy</div><div class="s zh">3 個步驟<br>有圖、有字</div></button>
      <button class="level l2" data-lv="normal"><div class="t">⭐⭐ 普通 Normal</div><div class="s zh">4 個步驟<br>有圖、有字</div></button>
      <button class="level l3" data-lv="hard"><div class="t">⭐⭐⭐ 困難 Hard</div><div class="s zh">4 個步驟<br>只有英文字（點了會念）</div></button>
      <button class="level l4" data-lv="super"><div class="t">👑 超難 Super</div><div class="s zh">只有英文字、不會念<br>多一張不該做的卡片<br>每關限時 40 秒</div></button>
    </div>
  </div>

  <div id="play" class="hidden">
    <div class="task">
      <button class="speak-btn" id="sayTitle">🔊</button>
      <h2 id="title"></h2>
    </div>
    <div class="slots" id="slots"></div>
    <div class="pool" id="pool"></div>
    <p class="hint zh" id="hint"></p>
  </div>

  <div class="panel result hidden" id="result">
    <div class="stars" id="stars"></div>
    <h2 id="resTitle" style="font-size:2.2rem;margin:.3em 0"></h2>
    <div class="zh" id="resText" style="font-size:1.2rem;color:var(--ink-soft)"></div>
    <div class="btns">
      <button class="btn pink" id="replay">再玩一次 Again</button>
      <button class="btn mint" onclick="location.reload()">換難度 Level</button>
      <a class="btn sky" href="index.html" style="text-decoration:none">回首頁 Home</a>
    </div>
  </div>
</div>

<script>
/* Bubble Fun — shared helpers */
const BF = (() => {
  let voice = null;
  function pickVoice() {
    try {
      const vs = speechSynthesis.getVoices();
      voice =
        vs.find(v => /en[-_]US/i.test(v.lang) && /Google US|Samantha|Aria|Jenny|Ana|Zira/i.test(v.name)) ||
        vs.find(v => /en[-_]US/i.test(v.lang)) ||
        vs.find(v => /^en/i.test(v.lang)) || null;
    } catch (e) {}
  }
  try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {}

  function say(text, rate = 0.85) {
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      if (voice) u.voice = voice;
      u.rate = rate; u.pitch = 1.1;
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  let ctx = null;
  function ac() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (ctx && ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, dur, type = 'sine', vol = 0.18, to = null, delay = 0) {
    const c = ac(); if (!c) return;
    const t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  const sfx = {
    pop() { tone(500, 0.09, 'sine', 0.25, 1400); },
    good() { tone(660, 0.12, 'triangle', 0.18); tone(880, 0.18, 'triangle', 0.18, null, 0.1); },
    bad() { tone(260, 0.22, 'triangle', 0.16, 180); },
    win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.2, 'triangle', 0.16, null, i * 0.12)); }
  };

  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pick = a => a[Math.floor(Math.random() * a.length)];

  function toast(text, color = 'var(--pink-deep)') {
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = text; t.style.color = color;
    document.body.appendChild(t); setTimeout(() => t.remove(), 950);
  }

  function wireSay(root = document) {
    root.addEventListener('click', e => {
      const el = e.target.closest('[data-say]');
      if (!el) return;
      BF.say(el.dataset.say);
      el.classList.remove('bounce'); void el.offsetWidth; el.classList.add('bounce');
    });
  }

  return { say, sfx, ac, shuffle, pick, toast, wireSay };
})();

const LEVEL_NAMES = { easy: '簡單 Easy', normal: '普通 Normal', hard: '困難 Hard', super: '超難 Super' };

/* ---------- bubbly background music (generated live, no audio files) ---------- */
BF.music = (() => {
  const KEY = 'bf-music';
  let on = false, master = null, timer = null, nextT = 0, step = 0, seed = 1;
  const BPM = 96, S8 = 60 / BPM / 2;           // eighth-note length
  const N = m => 440 * Math.pow(2, (m - 69) / 12);
  // C – Am – F – G, two bars each
  const CHORDS = [[60, 64, 67, 72], [57, 60, 64, 69], [53, 57, 60, 65], [55, 59, 62, 67]];
  const PENTA = [72, 74, 76, 79, 81, 84];
  const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  let melody = [];
  function makeMelody() {             // a 16-step phrase per chord, regenerated each loop for variety
    melody = CHORDS.map(ch => Array.from({ length: 16 }, (_, i) => {
      if (i % 2 && rnd() < .55) return null;
      const pool = (i % 4 === 0) ? ch.map(n => n + 12) : PENTA;
      return pool[Math.floor(rnd() * pool.length)];
    }));
  }
  function pluck(t, f, vol, dur = .5) {   // music-box / bubble pluck
    const c = BF.ac(); const o = c.createOscillator(), o2 = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o2.type = 'triangle';
    o.frequency.setValueAtTime(f * .985, t); o.frequency.exponentialRampToValueAtTime(f, t + .04);
    o2.frequency.setValueAtTime(f * 2, t);
    const g2 = c.createGain(); g2.gain.value = .12;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(master);
    o.start(t); o2.start(t); o.stop(t + dur + .05); o2.stop(t + dur + .05);
  }
  function bass(t, f) {
    const c = BF.ac(); const o = c.createOscillator(), g = c.createGain();
    o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(.22, t + .03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + S8 * 3.5);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + S8 * 4);
  }
  function blip(t) {                      // little "bloop" bubble
    const c = BF.ac(); const o = c.createOscillator(), g = c.createGain();
    const f0 = 300 + rnd() * 300;
    o.type = 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f0 * 3, t + .09);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(.12, t + .01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + .12);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + .15);
  }
  function tick() {
    const c = BF.ac();
    while (nextT < c.currentTime + .25) {
      const bar = Math.floor(step / 8), ci = Math.floor(bar / 2) % 4, i = step % 16, ch = CHORDS[ci];
      if (step % 64 === 0) makeMelody();
      const m = melody[ci][(bar % 2) * 8 + (step % 8)];
      if (m) pluck(nextT, N(m), (step % 8 === 0) ? .2 : .13, .45);
      if (step % 4 === 0) bass(nextT, N(ch[0] - 24));
      if (step % 2 === 1) pluck(nextT, N(ch[(step >> 1) % 3 + 1] ), .05, .3);  // soft arpeggio
      if (rnd() < .07) blip(nextT + S8 * rnd());
      nextT += S8 * (step % 2 ? .92 : 1.08);   // a little swing
      step++;
    }
  }
  function start() {
    const c = BF.ac(); if (!c) return;
    if (c.state !== 'running') { try { c.resume(); } catch (e) {} }
    if (!master) { master = c.createGain(); master.gain.value = 0; master.connect(c.destination); }
    master.gain.cancelScheduledValues(c.currentTime);
    master.gain.setTargetAtTime(.35, c.currentTime, .4);
    if (!timer) { seed = Math.floor(Math.random() * 233280); makeMelody(); nextT = c.currentTime + .1; step = 0; timer = setInterval(tick, 50); }
  }
  function stop() {
    if (!master) return;
    const c = BF.ac(); master.gain.setTargetAtTime(0, c.currentTime, .15);
    setTimeout(() => { if (!on) { clearInterval(timer); timer = null; } }, 600);
  }
  function duck(down) { if (master && on) { const c = BF.ac(); master.gain.setTargetAtTime(down ? .08 : .35, c.currentTime, .12); } }
  function save() { try { localStorage.setItem(KEY, on ? '1' : '0'); } catch (e) {} }
  function pref() { try { return localStorage.getItem(KEY) !== '0'; } catch (e) { return true; } }
  function render() {
    const b = document.getElementById('bf-music'); if (!b) return;
    b.innerHTML = (BF.icon ? BF.icon('music') : '♪') + (on ? '' : '<span class="slash"></span>');
    b.title = on ? '關閉背景音樂' : '開啟背景音樂';
    b.classList.toggle('off', !on);
  }
  function set(v) { on = v; save(); v ? start() : stop(); render(); }
  function init() {
    const b = document.createElement('button');
    b.id = 'bf-music'; b.type = 'button';
    b.addEventListener('click', e => { e.stopPropagation(); set(!on); b.blur(); });
    document.body.appendChild(b);
    const want = pref(); on = false; render();
    if (want) {   // browsers only allow sound after the first tap / key press
      const EVTS = ['pointerdown', 'pointerup', 'mousedown', 'click', 'touchend', 'keydown'];
      const kick = () => {
        if (!pref()) return done();
        const c = BF.ac(); if (!c) return;
        if (c.state !== 'running') { try { c.resume(); } catch (e) {} }
        if (!on) set(true);
        if (c.state === 'running') done();
      };
      const done = () => EVTS.forEach(ev => removeEventListener(ev, kick, true));
      EVTS.forEach(ev => addEventListener(ev, kick, true));
    }
  }
  return { init, set, duck, isOn: () => on };
})();
(() => {   // lower the music while the English voice is speaking
  const orig = BF.say;
  BF.say = (text, rate) => {
    BF.music.duck(true);
    orig(text, rate);

    speaker: `<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="#C6E2F7" stroke="${OUT}" stroke-width="1.6" stroke-linejoin="round"/><path d="M15 9q2 3 0 6M17.6 7q3.6 5 0 10" fill="none" stroke="${OUT}" stroke-width="1.6" stroke-linecap="round"/>`,
    eyes: `<ellipse cx="7.5" cy="12" rx="4.3" ry="5.5" fill="#fff" stroke="${OUT}" stroke-width="1.5"/><ellipse cx="16.5" cy="12" rx="4.3" ry="5.5" fill="#fff" stroke="${OUT}" stroke-width="1.5"/><circle cx="8.3" cy="12.8" r="2.1" fill="${OUT}"/><circle cx="17.3" cy="12.8" r="2.1" fill="${OUT}"/>`,
    clock: `<circle cx="12" cy="13" r="8" fill="#FCEBB0" stroke="${OUT}" stroke-width="1.6"/><path d="M12 8.5V13l3 2" fill="none" stroke="${OUT}" stroke-width="1.6" stroke-linecap="round"/><path d="M9.5 3.5h5" stroke="${OUT}" stroke-width="1.8" stroke-linecap="round"/>`,
    printer: `<rect x="6.5" y="3.5" width="11" height="6" rx="1" fill="#fff" stroke="${OUT}" stroke-width="1.5"/><rect x="3" y="9" width="18" height="8" rx="2.5" fill="#DCD0F4" stroke="${OUT}" stroke-width="1.5"/><rect x="7" y="14" width="10" height="6.5" rx="1" fill="#fff" stroke="${OUT}" stroke-width="1.5"/>`,
    book: `<path d="M3 5.5q4.5-1.5 9 1 4.5-2.5 9-1v13q-4.5-1.5-9 1-4.5-2.5-9-1z" fill="#FCEBB0" stroke="${OUT}" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 6.5v13" stroke="${OUT}" stroke-width="1.4"/>`,
    music: `<path d="M9 17.5V6l10-2v11.5" fill="none" stroke="${OUT}" stroke-width="1.7" stroke-linejoin="round"/><ellipse cx="6.6" cy="17.6" rx="3" ry="2.4" fill="#F4A6BE" stroke="${OUT}" stroke-width="1.5"/><ellipse cx="16.6" cy="15.6" rx="3" ry="2.4" fill="#8DBDE9" stroke="${OUT}" stroke-width="1.5"/><path d="M9 9.5l10-2" stroke="${OUT}" stroke-width="1.7"/>`,
    game: `<rect x="2.5" y="7" width="19" height="11" rx="5.5" fill="#C6E2F7" stroke="${OUT}" stroke-width="1.5"/><path d="M7 10.5v4M5 12.5h4" stroke="${OUT}" stroke-width="1.5" stroke-linecap="round"/><circle cx="16" cy="11" r="1.2" fill="#F4A6BE"/><circle cx="18" cy="13.8" r="1.2" fill="#93CF96"/>`
  };
  BF.icon = (k, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>`;

  const MAP = { '⭐': 'star', '👑': 'crown', '🏠': 'home', '🔊': 'speaker', '👀': 'eyes', '⏱': 'clock', '🖨️': 'printer', '📖': 'book', '🎮': 'game' };
  const RE = new RegExp(Object.keys(MAP).join('|'), 'g');
  BF.iconize = (root = document.body) => {
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const nodes = []; while (w.nextNode()) if (RE.test(w.currentNode.nodeValue)) nodes.push(w.currentNode);
    nodes.forEach(n => {
      if (n.parentNode.closest && n.parentNode.closest('script,style')) return;
      const span = document.createElement('span');
      span.innerHTML = n.nodeValue.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])).replace(RE, m => BF.icon(MAP[m]));
      n.replaceWith(...span.childNodes);
    });
  };
  BF.stars = n => [0, 1, 2].map(i => BF.icon('star', i < n ? 'big' : 'big off')).join('');

  /* hand-drawn floating background bubbles */
  BF.bgBubbles = (n = 14) => {
    ensureDefs();
    const box = document.createElement('div'); box.className = 'bg-bubbles';
    const cols = [null, null, null, 'purple', 'blue', 'red'];
    for (let i = 0; i < n; i++) {
      const b = document.createElement('div'); const s = 26 + Math.random() * 64;
      b.className = 'bgb';
      b.style.width = b.style.height = s + 'px';
      b.style.left = Math.random() * 100 + '%';
      b.style.animationDuration = 14 + Math.random() * 16 + 's';
      b.style.animationDelay = -Math.random() * 30 + 's';
      const c = BF.pick(cols);
      b.innerHTML = BF.bub(c, { face: s > 60 && Math.random() < .6, eyes: 'closed' });
      box.appendChild(b);
    }
    document.body.prepend(box);
  };
})();

</script>
<script>
BF.bgBubbles(10);
const SEQS = [
  { title: 'Make bubble water', zh: '做泡泡水', steps: [['Get a cup.', 'getcup'], ['Put in water.', 'water'], ['Put in soap.', 'soap'], ['Mix it.', 'mix']], easyDrop: 0 },
  { title: 'Blow bubbles', zh: '吹泡泡', steps: [['Open the bottle.', 'openbottle'], ['Dip the wand.', 'dip'], ['Blow!', 'blow'], ['Watch them fly.', 'watch']], easyDrop: 3 },
  { title: 'Clean up', zh: '收拾', steps: [['Close the bottle.', 'closebottle'], ['Put it away.', 'putaway'], ['Wash your hands.', 'wash'], ['Dry your hands.', 'dry']], easyDrop: 1 }
];
const DECOYS = [['Drink it.', 'drink'], ['Blow in your eyes.', 'blow'], ['Eat the soap.', 'soap']];
const LV = {
  easy:   { pics: true,  text: true, say: true,  easy: true,  decoy: false, time: 0 },
  normal: { pics: true,  text: true, say: true,  easy: false, decoy: false, time: 0 },
  hard:   { pics: false, text: true, say: true,  easy: false, decoy: false, time: 0 },
  super:  { pics: false, text: true, say: false, easy: false, decoy: true,  time: 40 }
};
let L, lvName, order, seqIdx, steps, placed, firstTry, perfect, timeLeft, timerId, locked;

document.querySelectorAll('.level').forEach(b => b.onclick = () => start(b.dataset.lv));
document.getElementById('replay').onclick = () => start(lvName);
document.getElementById('sayTitle').onclick = () => BF.say(SEQS[order[seqIdx]].title);

function start(lv) {
  BF.ac();
  lvName = lv; L = LV[lv]; perfect = 0; seqIdx = -1;
  order = BF.shuffle([0, 1, 2]);
  document.getElementById('select').classList.add('hidden');
  document.getElementById('result').classList.add('hidden');
  document.getElementById('play').classList.remove('hidden');
  const lvl = document.getElementById('lvl'); lvl.textContent = LEVEL_NAMES[lv]; lvl.classList.remove('hidden');
  document.getElementById('round').classList.remove('hidden');
  document.getElementById('timer').classList.toggle('hidden', !L.time);
  document.getElementById('hint').textContent = L.decoy ? '小心！有一張卡片是不該做的事，不要放進去。' : '';
  nextSeq();
}

function nextSeq() {
  clearInterval(timerId);
  seqIdx++;
  if (seqIdx >= 3) return finish();
  const S = SEQS[order[seqIdx]];
  steps = S.steps.map((s, i) => ({ text: s[0], art: s[1], pos: i }));
  if (L.easy) { steps = steps.filter((_, i) => i !== S.easyDrop).map((s, i) => ({ ...s, pos: i })); }
  let cards = steps.slice();
  if (L.decoy) { const d = BF.pick(DECOYS); cards.push({ text: d[0], art: d[1], pos: -1 }); }
  placed = Array(steps.length).fill(null);
  firstTry = true; locked = false;
  document.getElementById('round').textContent = `${seqIdx + 1} / 3`;
  document.getElementById('title').innerHTML = `${S.title} <span class="zh" style="font-size:.6em;color:var(--ink-soft)">${S.zh}</span>`;
  const slots = document.getElementById('slots');
  slots.style.setProperty('--n', steps.length);
  slots.innerHTML = steps.map((_, i) => `<div class="slot" data-i="${i}"><span class="n">${i + 1}</span></div>`).join('');
  const pool = document.getElementById('pool'); pool.innerHTML = '';
  BF.shuffle(cards).forEach(c => pool.appendChild(makeCard(c)));
  BF.say(S.title);
  if (L.time) {
    timeLeft = L.time; showTime();
    timerId = setInterval(() => { timeLeft--; showTime(); if (timeLeft <= 0) { clearInterval(timerId); timeUp(); } }, 1000);
  }
}
function showTime() { document.getElementById('timer').innerHTML = BF.icon('clock') + ' ' + Math.max(0, timeLeft); }

function makeCard(c) {
  const b = document.createElement('button');
  b.className = 'card' + (L.pics ? '' : ' textonly');
  b.innerHTML = (L.pics ? BF.art(c.art) : '') + `<div class="w">${c.text}</div>`;
  b._c = c;
  b.onclick = () => tap(b);
  return b;
}

function tap(b) {
  if (locked) return;
  if (L.say) BF.say(b._c.text); else BF.sfx.pop();
  const slotEl = b.closest('.slot');
  if (slotEl) { // send back to pool
    placed[+slotEl.dataset.i] = null;
    slotEl.classList.remove('ok', 'no');
    document.getElementById('pool').appendChild(b);
    return;
  }
  const i = placed.indexOf(null);
  if (i < 0) return;
  placed[i] = b;
  document.querySelector(`.slot[data-i="${i}"]`).appendChild(b);
  if (!placed.includes(null)) check();
}

function check() {
  let all = true;
  placed.forEach((b, i) => {
    const s = document.querySelector(`.slot[data-i="${i}"]`);
    const ok = b._c.pos === i;
    s.classList.toggle('ok', ok); s.classList.toggle('no', !ok);
    if (!ok) all = false;
  });
  if (all) {
    locked = true; clearInterval(timerId);
    if (firstTry) perfect++;
    BF.sfx.good(); BF.toast(firstTry ? 'Perfect!' : 'Good job!');
    setTimeout(() => { if (L.say) readAll(); }, 500);
    setTimeout(nextSeq, L.say ? 4200 : 1500);
  } else {
    firstTry = false; BF.sfx.bad();
    document.getElementById('slots').classList.add('shake');
    setTimeout(() => {
      document.getElementById('slots').classList.remove('shake');
      placed.forEach((b, i) => {
        if (b._c.pos !== i) {
          const s = document.querySelector(`.slot[data-i="${i}"]`); s.classList.remove('no');
          document.getElementById('pool').appendChild(b); placed[i] = null;
        }
      });
    }, 700);
  }
}

function readAll() { BF.say(steps.map(s => s.text).join(' ')); }

function timeUp() {
  locked = true; firstTry = false;
  BF.sfx.bad(); BF.toast("Time's up!", 'var(--peach-deep)');
  // show the answer briefly
  const slots = document.querySelectorAll('.slot');
  steps.forEach((s, i) => {
    slots[i].querySelectorAll('.card').forEach(c => c.remove());
    const b = makeCard(s); b.disabled = true; slots[i].appendChild(b); slots[i].classList.add('ok');
  });
  document.getElementById('pool').innerHTML = '';
  setTimeout(nextSeq, 3000);
}

function finish() {
  clearInterval(timerId);
  document.getElementById('play').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
  const st = perfect === 3 ? 3 : perfect === 2 ? 2 : 1;
  document.getElementById('stars').innerHTML = BF.stars(st);
  document.getElementById('resTitle').textContent = st === 3 ? 'Amazing!' : st === 2 ? 'Good job!' : 'Nice try!';
  document.getElementById('resText').textContent = `3 關裡有 ${perfect} 關一次就排對`;
  BF.sfx.win();
}
BF.iconize();
</script>
</body>
</html>
