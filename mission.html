<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bubble Mission 任務卡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Bubble Fun — shared styles (soft pastel) */
:root{
  --bg:#FFF8F1;
  --ink:#5B4A5E;
  --ink-soft:#8C7A8F;
  --pink:#F9C9D6;
  --pink-deep:#EE9DB4;
  --mint:#C3E9D9;
  --mint-deep:#86CDB0;
  --lav:#DCD0F4;
  --lav-deep:#B39DE3;
  --sky:#C6E2F7;
  --sky-deep:#8EC1E8;
  --butter:#FCEBB0;
  --butter-deep:#F3D06B;
  --peach:#FDD9C1;
  --peach-deep:#F5AE84;
  --card:#FFFFFF;
  --shadow:0 6px 0 rgba(91,74,94,.08), 0 10px 24px rgba(91,74,94,.08);
  /* game colors: soft but clearly recognisable */
  --c-red:#F0767B;
  --c-orange:#F7A456;
  --c-yellow:#F5CF4E;
  --c-green:#79C27E;
  --c-blue:#6DA6DD;
  --c-purple:#A88AD8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Fredoka","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;
  min-height:100vh;
}
a{color:inherit}
button{font-family:inherit;color:inherit;cursor:pointer}
.zh{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}

/* ---------- bubbles ---------- */
.bg-bubbles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bgb{position:absolute;bottom:-120px;opacity:.7;animation:rise linear infinite}
.bgb svg{display:block}
@keyframes rise{
  0%{transform:translate(0,0) rotate(0)}
  25%{transform:translate(18px,-28vh) rotate(6deg)}
  50%{transform:translate(-14px,-56vh) rotate(-4deg)}
  75%{transform:translate(16px,-84vh) rotate(5deg)}
  100%{transform:translate(0,-125vh) rotate(0)}
}
.bub{display:block}
.bub svg{display:block;width:100%;height:100%}
.ic{width:1.2em;height:1.2em;vertical-align:-.25em;display:inline-block}
.ic.big{width:1em;height:1em;vertical-align:middle}
.ic.off{filter:grayscale(1);opacity:.28}

/* ---------- common UI ---------- */
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:24px 16px 48px}
.btn{
  border:none;border-radius:999px;padding:.6em 1.3em;font-size:1.05rem;font-weight:600;
  background:var(--card);box-shadow:var(--shadow);transition:transform .12s;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(2px) scale(.98)}
.btn.pink{background:var(--pink)} .btn.mint{background:var(--mint)}
.btn.lav{background:var(--lav)} .btn.sky{background:var(--sky)}
.btn.butter{background:var(--butter)} .btn.peach{background:var(--peach)}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topbar .spacer{flex:1}
.home-link{text-decoration:none;font-weight:600;background:var(--card);border-radius:999px;padding:.45em 1em;box-shadow:var(--shadow)}

/* ---------- hand-drawn art ---------- */
.art{position:relative;display:inline-block;width:6em;height:4.6em;font-size:1rem;line-height:1}
.art svg{width:100%;height:100%;overflow:visible;display:block}
.art g[class^="an-"]{transform-box:fill-box;transform-origin:center}
.an-blow{animation:blowOut 2.4s ease-out infinite}
.an-blow.b2{animation-delay:.8s}.an-blow.b3{animation-delay:1.6s}
@keyframes blowOut{0%{transform:translate(18px,8px) scale(.25);opacity:0}20%{opacity:1}80%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(-4px,-4px) scale(1);opacity:0}}
.an-pop{animation:popIt 2s ease-in infinite}
.an-boom{animation:boom 2s ease-out infinite}
@keyframes popIt{0%{transform:scale(.85)}55%{transform:scale(1.12);opacity:1}62%{transform:scale(1.3);opacity:0}92%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(.85)}}
@keyframes boom{0%,55%{opacity:0;transform:scale(.5)}66%{opacity:1;transform:scale(1.05)}90%{opacity:1}100%{opacity:0;transform:scale(1.15)}}
.an-float{animation:floatUp 3s ease-in-out infinite}
@keyframes floatUp{0%{transform:translate(0,10px)}50%{transform:translate(4px,-2px)}100%{transform:translate(-2px,10px)}}
.an-fly{animation:flyBy 2.2s ease-in-out infinite}
@keyframes flyBy{0%{transform:translate(-14px,4px)}50%{transform:translate(8px,-4px)}100%{transform:translate(-14px,4px)}}
.an-land{animation:landHand 2.4s ease-in-out infinite}
@keyframes landHand{0%{transform:translateY(-14px)}55%,100%{transform:translateY(0)}}
.an-stir{animation:stir 1.1s ease-in-out infinite;transform-origin:0% 100%!important}
@keyframes stir{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
.an-dip{animation:dip 1.8s ease-in-out infinite}
@keyframes dip{0%,100%{transform:translateY(-8px)}50%{transform:translateY(4px)}}
.an-drop{animation:dropIn 1.6s ease-in infinite}
@keyframes dropIn{0%{transform:translateY(-8px);opacity:0}25%{opacity:1}80%{transform:translateY(12px);opacity:1}100%{transform:translateY(14px);opacity:0}}
.an-bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.an-cap{animation:capWiggle 1.4s ease-in-out infinite}
@keyframes capWiggle{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(2px,-4px) rotate(8deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-iteration-count:1!important}}

/* ---------- game shell ---------- */
.game-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.game-head h1{margin:0;font-size:clamp(1.4rem,3.5vw,2.2rem)}
.pill{background:var(--card);border-radius:999px;padding:.35em .9em;font-weight:600;box-shadow:var(--shadow)}
.panel{background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:clamp(16px,3vw,32px)}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:18px}
.level{border:none;border-radius:24px;padding:22px 18px;text-align:left;box-shadow:var(--shadow);transition:transform .12s}
.level:hover{transform:translateY(-3px) rotate(-.5deg)}
.level .t{font-size:1.5rem;font-weight:700}
.level .s{margin-top:6px;color:var(--ink-soft);font-size:.95rem;line-height:1.45}
.level.l1{background:var(--mint)} .level.l2{background:var(--butter)}
.level.l3{background:var(--peach)} .level.l4{background:var(--lav)}
.hidden{display:none!important}
.result{text-align:center}
.result .stars{font-size:clamp(3rem,10vw,5rem);letter-spacing:.1em}

.result .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.bounce{animation:bounce .4s}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.speak-btn{border:none;background:var(--sky);border-radius:50%;width:2.6em;height:2.6em;font-size:1.3rem;box-shadow:var(--shadow)}
.timer{font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;top:18%;transform:translate(-50%,0);font-size:clamp(2rem,7vw,4rem);font-weight:700;pointer-events:none;z-index:50;
  animation:toast 0.9s ease-out forwards;text-shadow:0 3px 0 #fff}
@keyframes toast{0%{opacity:0;transform:translate(-50%,20px) scale(.7)}25%{opacity:1;transform:translate(-50%,0) scale(1.05)}100%{opacity:0;transform:translate(-50%,-30px) scale(1)}}

</style>
<style>
  .bar{display:flex;gap:12px;justify-content:center;margin:10px 0 20px;flex-wrap:wrap}
  .sheet{background:#fff;width:210mm;max-width:100%;margin:0 auto;padding:8mm;box-shadow:var(--shadow);border-radius:12px}
  .mcard{border:3px dashed var(--lav-deep);border-radius:22px;padding:14px 20px;height:132mm;display:flex;flex-direction:column;background:linear-gradient(#FFFDF9,#FFF6FA)}
  .mcard + .mcard{margin-top:8mm}
  .mhead{display:flex;align-items:center;gap:12px}
  .mhead h2{margin:0;font-size:30px;color:var(--pink-deep)}
  .mhead .name{margin-left:auto;font-size:18px}
  .mhead .name span{display:inline-block;width:52mm;border-bottom:2px solid var(--ink-soft)}
  .tasks{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .t{display:flex;align-items:center;gap:10px;border-radius:18px;padding:8px 12px}
  .t:nth-child(1){background:#FDEFF3}.t:nth-child(2){background:#EEF6FD}.t:nth-child(3){background:#FFF8E1}.t:nth-child(4){background:#EEF8F3}
  .t .art{font-size:16px;flex:none}
  .t .en{font-size:21px;font-weight:600;line-height:1.25}
  .t .zh{font-size:14px;color:var(--ink-soft)}
  .t .box{margin-left:auto;width:30px;height:30px;border:3px solid var(--ink-soft);border-radius:50%;flex:none}
  .blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--ink-soft)}
  @media print{
    @page{size:A4;margin:0}
    body{background:#fff}
    .bar,.bg-bubbles,.home-link{display:none!important}
    .wrap{padding:0}
    .sheet{box-shadow:none;border-radius:0;width:210mm;padding:8mm}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <a class="home-link" href="index.html">🏠 Home</a>
    <button class="btn pink" onclick="print()">🖨️ 列印 Print</button>
  </div>
  <div class="sheet" id="sheet"></div>
</div>
<script>
/* Bubble Fun — shared helpers */
const BF = (() => {
  let voice = null;
  function pickVoice() {
    try {
      const vs = speechSynthesis.getVoices();
      voice =
        vs.find(v => /en[-_]US/i.test(v.lang) && /Google US|Samantha|Aria|Jenny|Ana|Zira/i.test(v.name)) ||
        vs.find(v => /en[-_]US/i.test(v.lang)) ||
        vs.find(v => /^en/i.test(v.lang)) || null;
    } catch (e) {}
  }
  try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {}

  function say(text, rate = 0.85) {
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      if (voice) u.voice = voice;
      u.rate = rate; u.pitch = 1.1;
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  let ctx = null;
  function ac() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (ctx && ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, dur, type = 'sine', vol = 0.18, to = null, delay = 0) {
    const c = ac(); if (!c) return;
    const t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  const sfx = {
    pop() { tone(500, 0.09, 'sine', 0.25, 1400); },
    good() { tone(660, 0.12, 'triangle', 0.18); tone(880, 0.18, 'triangle', 0.18, null, 0.1); },
    bad() { tone(260, 0.22, 'triangle', 0.16, 180); },
    win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.2, 'triangle', 0.16, null, i * 0.12)); }
  };

  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pick = a => a[Math.floor(Math.random() * a.length)];

  function toast(text, color = 'var(--pink-deep)') {
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = text; t.style.color = color;
    document.body.appendChild(t); setTimeout(() => t.remove(), 950);
  }

  function wireSay(root = document) {
    root.addEventListener('click', e => {
      const el = e.target.closest('[data-say]');
      if (!el) return;
      say(el.dataset.say);
      el.classList.remove('bounce'); void el.offsetWidth; el.classList.add('bounce');
    });
  }

  return { say, sfx, ac, shuffle, pick, toast, wireSay };
})();

const LEVEL_NAMES = { easy: '簡單 Easy', normal: '普通 Normal', hard: '困難 Hard', super: '超難 Super' };

/* Bubble Fun — hand-drawn style illustrations (inline SVG) */
(() => {
  const OUT = '#5B4A5E', SW = 2.6;
  const SKIN = '#FDE1CC', HAIR = '#7A5A4E', BLUSH = '#F6A5B5', MOUTH = '#E9788F';
  const COL = {
    red:    { a: '#FCD3D4', b: '#F49A9E', line: '#C9545B' },
    orange: { a: '#FDE3C6', b: '#F9B877', line: '#D27F31' },
    yellow: { a: '#FDF2C4', b: '#F6D861', line: '#C79C1C' },
    green:  { a: '#D8F0D8', b: '#93CF96', line: '#4F9A55' },
    blue:   { a: '#D6E8F8', b: '#8DBDE9', line: '#3F7FBE' },
    purple: { a: '#E8DEF8', b: '#B79BE6', line: '#7B58B8' }
  };

  /* ---------- shared <defs> ---------- */
  function ensureDefs() {
    if (document.getElementById('bf-defs')) return;
    const grads = Object.entries(COL).map(([k, c]) =>
      `<radialGradient id="bf-${k}" cx=".38" cy=".34" r=".72"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="${c.a}"/><stop offset="1" stop-color="${c.b}"/></radialGradient>`).join('');
    const html = `<svg id="bf-defs" width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
      <filter id="bfWob" x="-8%" y="-8%" width="116%" height="116%">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <radialGradient id="bfIri" cx=".38" cy=".34" r=".72">
        <stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#F0F6FF"/>
        <stop offset=".78" stop-color="#F8E6F5"/><stop offset="1" stop-color="#DDD3FA"/>
      </radialGradient>${grads}</defs></svg>`;
    (document.body || document.documentElement).insertAdjacentHTML('afterbegin', html);
  }
  if (document.body) ensureDefs(); else document.addEventListener('DOMContentLoaded', ensureDefs);

  /* ---------- little parts ---------- */
  const f = n => +n.toFixed(2);
  function eyes(cx, cy, s, t) {
    if (t === 'closed')
      return `<path d="M${f(cx - 7.5 * s)} ${f(cy + 1)} q${f(2.6 * s)} ${f(-3.4 * s)} ${f(5.2 * s)} 0 M${f(cx + 2.3 * s)} ${f(cy + 1)} q${f(2.6 * s)} ${f(-3.4 * s)} ${f(5.2 * s)} 0" fill="none" stroke="${OUT}" stroke-width="${f(1.9 * s)}" stroke-linecap="round"/>`;
    const up = t === 'up' ? -1.6 * s : 0, big = t === 'wow' ? 1.25 : 1;
    return [-5, 5].map(dx =>
      `<ellipse cx="${f(cx + dx * s)}" cy="${f(cy + up)}" rx="${f(1.9 * s * big)}" ry="${f(2.5 * s * big)}" fill="${OUT}"/><circle cx="${f(cx + dx * s + .7 * s)}" cy="${f(cy + up - .9 * s)}" r="${f(.7 * s)}" fill="#fff"/>`).join('');
  }
  function mouth(cx, cy, s, t) {
    if (t === 'o') return `<ellipse cx="${f(cx)}" cy="${f(cy + .6 * s)}" rx="${f(2 * s)}" ry="${f(2.4 * s)}" fill="${MOUTH}" stroke="${OUT}" stroke-width="${f(1.3 * s)}"/>`;
    if (t === 'wow') return `<ellipse cx="${f(cx)}" cy="${f(cy + 1 * s)}" rx="${f(2.4 * s)}" ry="${f(3.2 * s)}" fill="${MOUTH}" stroke="${OUT}" stroke-width="${f(1.3 * s)}"/>`;
    if (t === 'open') return `<path d="M${f(cx - 4 * s)} ${f(cy)} q${f(4 * s)} ${f(6.5 * s)} ${f(8 * s)} 0 z" fill="${MOUTH}" stroke="${OUT}" stroke-width="${f(1.4 * s)}" stroke-linejoin="round"/>`;
    return `<path d="M${f(cx - 3 * s)} ${f(cy)} q${f(3 * s)} ${f(3.6 * s)} ${f(6 * s)} 0" fill="none" stroke="${OUT}" stroke-width="${f(1.7 * s)}" stroke-linecap="round"/>`;
  }
  const blush = (cx, cy, s, dx = 9) => [-dx, dx].map(d => `<ellipse cx="${f(cx + d * s)}" cy="${f(cy)}" rx="${f(3 * s)}" ry="${f(1.8 * s)}" fill="${BLUSH}" opacity=".75"/>`).join('');
  const face = (cx, cy, s = 1, e = 'open', m = 'smile', dx = 9, mdx = 0) =>
    eyes(cx, cy, s, e) + blush(cx, cy + 3.2 * s, s, dx) + mouth(cx + mdx * s, cy + 4.6 * s, s, m);

  function bubble(cx, cy, r, o = {}) {
    const c = o.color ? COL[o.color] : null;
    const fill = c ? `url(#bf-${o.color})` : 'url(#bfIri)', line = c ? c.line : '#9A89CC';
    const sw = Math.max(1.6, Math.min(SW, r * .14));
    return `<g class="${o.cls || ''}">
      <circle cx="${f(cx)}" cy="${f(cy)}" r="${f(r)}" fill="${fill}" stroke="${line}" stroke-width="${f(sw)}"/>
      <path d="M${f(cx - r * .98)} ${f(cy + r * .25)} A${f(r)} ${f(r)} 0 0 0 ${f(cx + r * .35)} ${f(cy + r * .95)}" fill="none" stroke="${line}" stroke-width="${f(sw * .55)}" stroke-linecap="round" opacity=".45" transform="translate(${f(r * .06)},${f(-r * .05)})"/>
      <path d="M${f(cx - r * .62)} ${f(cy - r * .08)} A${f(r * .62)} ${f(r * .62)} 0 0 1 ${f(cx - r * .12)} ${f(cy - r * .6)}" fill="none" stroke="#fff" stroke-width="${f(Math.max(1.4, r * .13))}" stroke-linecap="round"/>
      <circle cx="${f(cx + r * .5)}" cy="${f(cy + r * .45)}" r="${f(r * .07)}" fill="#fff" opacity=".85"/>
      ${o.face ? face(cx, cy + r * .1, r / 22, o.eyes || 'open', o.mouth || 'smile', 8.5) : ''}
    </g>`;
  }
  const sparkle = (x, y, s, c = '#F6D861') =>
    `<path d="M${x} ${y - s} Q${x} ${y} ${x + s} ${y} Q${x} ${y} ${x} ${y + s} Q${x} ${y} ${x - s} ${y} Q${x} ${y} ${x} ${y - s}Z" fill="${c}" stroke="${OUT}" stroke-width="1.4" stroke-linejoin="round"/>`;

  function cup(x, y, w, h, o = {}) {
    const body = `M${x} ${y} L${x + w} ${y} L${x + w - 7} ${y + h - 7} Q${x + w - 8} ${y + h} ${x + w - 15} ${y + h} L${x + 15} ${y + h} Q${x + 8} ${y + h} ${x + 7} ${y + h - 7} Z`;
    const yw = y + h * .38, lw = x + 4.5, rw = x + w - 4.5;
    const water = o.water ? `<path d="M${lw} ${yw} Q${x + w * .3} ${yw - 3} ${x + w / 2} ${yw} T${rw} ${yw} L${x + w - 8.5} ${y + h - 6} Q${x + w - 9.5} ${y + h - 2} ${x + w - 15} ${y + h - 2} L${x + 15} ${y + h - 2} Q${x + 9.5} ${y + h - 2} ${x + 8.5} ${y + h - 6} Z" fill="${o.soapy ? '#D9CCF4' : '#BFE0F8'}"/>` : '';
    return `<path d="${body}" fill="#FFFDF8"/>${water}
      <path d="${body}" fill="none" stroke="${OUT}" stroke-width="${SW}" stroke-linejoin="round"/>
      <ellipse cx="${x + w / 2}" cy="${y}" rx="${w / 2}" ry="4.2" fill="#EEF6FD" stroke="${OUT}" stroke-width="${SW}"/>
      ${o.face === false ? '' : face(x + w / 2, y + h * .58, .85, o.eyes || 'open', o.mouth || 'smile', 9)}`;
  }
  function kid(cx, cy, r, o = {}) {
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${SKIN}" stroke="${OUT}" stroke-width="${SW}"/>
      <path d="M${cx - r} ${cy - 1} Q${cx - r * 1.02} ${cy - r * 1.12} ${cx} ${cy - r * 1.04} Q${cx + r * 1.02} ${cy - r * 1.12} ${cx + r} ${cy - 1} Q${cx + r * .7} ${cy - r * .5} ${cx + r * .25} ${cy - r * .55} Q${cx + r * .05} ${cy - r * .3} ${cx - r * .2} ${cy - r * .52} Q${cx - r * .65} ${cy - r * .45} ${cx - r} ${cy - 1}Z" fill="${HAIR}" stroke="${OUT}" stroke-width="${SW}" stroke-linejoin="round"/>
      ${face(cx, cy + r * .12, r / 20, o.eyes || 'open', o.mouth || 'smile', 10, o.mdx || 0)}`;
  }
  function hand(x, y, s = 1, sleeve = '#C3E9D9') {
    const fing = [0, 7.2, 14.4, 21.6].map((d, i) => `<rect x="${x + d * s}" y="${y - (i === 1 || i === 2 ? 10 : 7) * s}" width="${6.6 * s}" height="${16 * s}" rx="${3.3 * s}" fill="${SKIN}" stroke="${OUT}" stroke-width="${SW * .85}"/>`).join('');
    return `<rect x="${x + 2 * s}" y="${y + 20 * s}" width="${25 * s}" height="${16 * s}" rx="${5 * s}" fill="${sleeve}" stroke="${OUT}" stroke-width="${SW * .85}"/>
      ${fing}
      <ellipse cx="${x - 2 * s}" cy="${y + 10 * s}" rx="${4 * s}" ry="${7.5 * s}" transform="rotate(-35 ${x - 2 * s} ${y + 10 * s})" fill="${SKIN}" stroke="${OUT}" stroke-width="${SW * .85}"/>
      <rect x="${x - 1 * s}" y="${y + 2 * s}" width="${31 * s}" height="${21 * s}" rx="${10 * s}" fill="${SKIN}" stroke="${OUT}" stroke-width="${SW * .85}"/>`;
  }
  function bottle(x, y, o = {}) {
    const cap = `<rect x="${x + 9}" y="${y - 15}" width="16" height="9" rx="3" fill="#F4A6BE" stroke="${OUT}" stroke-width="${SW}"/>`;
    return `<rect x="${x + 11}" y="${y - 7}" width="12" height="9" fill="#DCD0F4" stroke="${OUT}" stroke-width="${SW}"/>
      <rect x="${x}" y="${y}" width="34" height="46" rx="11" fill="#DCD0F4" stroke="${OUT}" stroke-width="${SW}"/>
      <rect x="${x + 6}" y="${y + 21}" width="22" height="17" rx="6" fill="#fff" stroke="${OUT}" stroke-width="1.6"/>
      <circle cx="${x + 17}" cy="${y + 29.5}" r="4.5" fill="url(#bfIri)" stroke="#9A89CC" stroke-width="1.4"/>
      ${face(x + 17, y + 9, .62, o.eyes || 'open', o.mouth || 'smile', 9)}
      ${o.open ? (o.noCap ? '' : `<g class="an-cap">${cap.replace(`x="${x + 9}" y="${y - 15}"`, `x="${x + 30}" y="${y - 26}" transform="rotate(28 ${x + 38} ${y - 21})"`)}</g>
        <path d="M${x + 26} ${y - 14} q4 -6 10 -6 M${x + 22} ${y - 20} q2 -5 7 -8" fill="none" stroke="${OUT}" stroke-width="1.6" stroke-linecap="round"/>`) : cap}`;
  }
  const wandRing = (cx, cy, r) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${OUT}" stroke-width="7.5"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#F4A6BE" stroke-width="4"/>`;
  const stick = (x1, y1, x2, y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${OUT}" stroke-width="7.5" stroke-linecap="round"/><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#F9C79F" stroke-width="4" stroke-linecap="round"/>`;
  const noSign = (cx, cy, r) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#EE6F78" stroke-width="5.5" opacity=".9"/><line x1="${cx - r * .7}" y1="${cy - r * .7}" x2="${cx + r * .7}" y2="${cy + r * .7}" stroke="#EE6F78" stroke-width="5.5" stroke-linecap="round" opacity=".9"/>`;
  const drop = (cx, cy, s = 1, withFace = true) => `<path d="M${cx} ${cy - 13 * s} C${cx + 3 * s} ${cy - 8 * s} ${cx + 9 * s} ${cy - 2 * s} ${cx + 9 * s} ${cy + 3 * s} A${9 * s} ${9 * s} 0 0 1 ${cx - 9 * s} ${cy + 3 * s} C${cx - 9 * s} ${cy - 2 * s} ${cx - 3 * s} ${cy - 8 * s} ${cx} ${cy - 13 * s}Z" fill="#A9D4F5" stroke="${OUT}" stroke-width="${SW * .9}" stroke-linejoin="round"/>${withFace ? face(cx, cy + 2 * s, .5 * s, 'open', 'smile', 9) : ''}`;

  /* ---------- the illustrations (viewBox 0 0 120 92) ---------- */
  const A = {
    bubble: () => bubble(60, 46, 34, { face: true }) + sparkle(104, 18, 7) + sparkle(16, 72, 5, '#F4A6BE'),
    water: () => cup(34, 42, 52, 46, { water: true }) + `<g class="an-drop">${drop(60, 18, 1)}</g>`,
    soap: () => `<rect x="24" y="42" width="72" height="38" rx="14" fill="#F9C9D6" stroke="${OUT}" stroke-width="${SW}"/>
        <path d="M34 50 q10 -4 22 -3" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        ${face(60, 60, .95, 'closed', 'smile', 10)}
        ${bubble(22, 32, 9)}${bubble(96, 26, 11)}${bubble(80, 12, 6)}${bubble(40, 18, 5)}`,
    cup: () => cup(32, 26, 56, 60, {}) + sparkle(100, 24, 7) + sparkle(20, 40, 5, '#A9D4F5'),
    wand: () => stick(60, 44, 60, 88) + wandRing(60, 26, 17) + sparkle(96, 16, 7) + sparkle(24, 36, 5, '#F4A6BE') + sparkle(92, 56, 4, '#A9D4F5'),
    mix: () => cup(26, 40, 56, 46, { water: true, soapy: true, eyes: 'closed' }) +
        `<g class="an-stir">${stick(58, 50, 76, 6)}</g>` + bubble(30, 34, 6) + bubble(42, 30, 4) + bubble(96, 54, 8) + bubble(104, 38, 5),
    blow: () => kid(88, 52, 23, { eyes: 'closed', mouth: 'o', mdx: -6 }) + stick(60, 60, 50, 88) + wandRing(60, 52, 9) +
        `<g class="an-blow b1">${bubble(38, 42, 11, { face: true })}</g><g class="an-blow b2">${bubble(18, 24, 7)}</g><g class="an-blow b3">${bubble(36, 14, 5)}</g>`,
    pop: () => `<g class="an-boom">${[0, 45, 90, 135, 180, 225, 270, 315].map(a => {
          const r1 = 30, r2 = 41, rad = a * Math.PI / 180;
          return `<line x1="${f(60 + r1 * Math.cos(rad))}" y1="${f(50 + r1 * Math.sin(rad))}" x2="${f(60 + r2 * Math.cos(rad))}" y2="${f(50 + r2 * Math.sin(rad))}" stroke="${a % 90 ? '#F6D861' : '#EE9DB4'}" stroke-width="4.5" stroke-linecap="round"/>`;
        }).join('')}
        <text x="60" y="16" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="700" font-size="17" fill="#EE9DB4" stroke="${OUT}" stroke-width="1.2" paint-order="stroke">POP!</text></g>
        <g class="an-pop">${bubble(60, 50, 24, { face: true, eyes: 'wow', mouth: 'wow' })}</g>`,
    float: () => `<path d="M82 30 a9 9 0 0 1 3 -16 a11 11 0 0 1 20 -3 a9 9 0 0 1 8 19 z" fill="#fff" stroke="${OUT}" stroke-width="${SW}" stroke-linejoin="round"/>${eyes(97, 21, .45, 'closed')}
        <path d="M20 78 L20 42 M12 51 L20 41 L28 51" fill="none" stroke="#86CDB0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <g class="an-float">${bubble(58, 52, 21, { face: true })}<path d="M52 82 q-3 4 0 8 M64 82 q3 4 0 8" fill="none" stroke="#B39DE3" stroke-width="2.2" stroke-linecap="round"/></g>`,
    fly: () => `<path d="M4 34 q22 -8 36 0 q7 5 2 10 q-5 4 -8 -1" fill="none" stroke="#8EC1E8" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M8 56 q24 -6 34 2" fill="none" stroke="#8EC1E8" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M14 72 q16 -4 24 1 q6 4 1 8" fill="none" stroke="#8EC1E8" stroke-width="3.2" stroke-linecap="round"/>
        <g class="an-fly">${bubble(62, 34, 13, { face: true, eyes: 'closed', mouth: 'open' })}${bubble(84, 60, 9)}${bubble(98, 26, 7)}</g>
        <g transform="rotate(-25 104 76)"><ellipse cx="104" cy="76" rx="11" ry="6" fill="#A8D9A9" stroke="${OUT}" stroke-width="2"/><path d="M94 76 L113 76" stroke="${OUT}" stroke-width="1.4"/></g>`,
    catch: () => hand(44, 52, 1.05) + `<g class="an-land">${bubble(60, 30, 18, { face: true, eyes: 'closed', mouth: 'open' })}</g>` + sparkle(98, 22, 6) + sparkle(22, 30, 4, '#F4A6BE'),
    getcup: () => `<rect x="-2" y="48" width="26" height="20" rx="7" fill="#C3E9D9" stroke="${OUT}" stroke-width="${SW}"/>
        <rect x="30" y="50" width="22" height="7" rx="3.5" fill="${SKIN}" stroke="${OUT}" stroke-width="2.2"/>
        <rect x="18" y="47" width="22" height="22" rx="10" fill="${SKIN}" stroke="${OUT}" stroke-width="2.2"/>` +
        cup(58, 28, 50, 56, { eyes: 'wow', mouth: 'open' }) + sparkle(112, 20, 5),
    openbottle: () => bottle(42, 40, { open: true, eyes: 'wow', mouth: 'open' }) + sparkle(20, 30, 6) + sparkle(100, 64, 5, '#A9D4F5'),
    closebottle: () => bottle(32, 40, { eyes: 'closed' }) + `<path d="M80 52 l9 10 l18 -24" fill="none" stroke="${OUT}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M80 52 l9 10 l18 -24" fill="none" stroke="#93CF96" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>`,
    dip: () => bottle(40, 42, { open: true, noCap: true, eyes: 'closed', mouth: 'open' }) + `<g class="an-dip">${stick(64, 22, 92, -2)}${wandRing(57, 26, 8)}</g>` + sparkle(100, 60, 5),
    watch: () => kid(38, 58, 23, { eyes: 'up', mouth: 'open' }) + `<g class="an-bob">${bubble(84, 30, 14, { face: true })}</g>${bubble(108, 12, 7)}${bubble(104, 56, 6)}${bubble(70, 8, 4)}`,
    putaway: () => `<g transform="translate(46 8) scale(.62)">${bottle(0, 22, { eyes: 'closed' })}</g>
        <path d="M24 44 L10 30 L48 30 L56 44 Z M96 44 L110 30 L72 30 L64 44 Z" fill="#F7DDB8" stroke="${OUT}" stroke-width="${SW}" stroke-linejoin="round"/>
        <rect x="24" y="44" width="72" height="42" rx="5" fill="#F3D0A2" stroke="${OUT}" stroke-width="${SW}"/>
        <path d="M50 58 h20" stroke="${OUT}" stroke-width="2" stroke-linecap="round"/>${face(60, 68, .8, 'closed', 'smile', 11)}`,
    wash: () => `<path d="M16 8 h44 a5 5 0 0 1 5 5 v8 h-12 v-4 h-37 a5 5 0 0 1 0 -9z" fill="#CFD8E3" stroke="${OUT}" stroke-width="${SW}" stroke-linejoin="round"/>
        <g class="an-drop">${drop(59, 34, .55, false)}</g>` + hand(18, 58, .78) + `<g transform="translate(120 0) scale(-1 1)">${hand(22, 58, .78)}</g>` +
        bubble(50, 50, 7) + bubble(62, 60, 9) + bubble(76, 46, 5) + bubble(40, 64, 5) + bubble(84, 66, 6),
    dry: () => hand(14, 52, .8) + `<g transform="translate(120 0) scale(-1 1)">${hand(18, 52, .8)}</g>
        <path d="M46 20 h30 v58 q-15 6 -30 0z" fill="#C3E9D9" stroke="${OUT}" stroke-width="${SW}" stroke-linejoin="round"/>
        <path d="M46 34 h30 M46 66 h30" stroke="#86CDB0" stroke-width="3"/>${face(61, 46, .7, 'closed', 'smile', 10)}`,
    drink: () => kid(44, 50, 22, { eyes: 'open', mouth: 'open' }) + `<g transform="rotate(-50 88 44)">${bottle(72, 30, { eyes: 'wow', mouth: 'o' })}</g>`,
    nodrink: () => kid(42, 50, 21, { eyes: 'open', mouth: 'open' }) + `<g transform="rotate(-50 88 44)">${bottle(72, 30, { eyes: 'wow', mouth: 'o' })}</g>` + noSign(60, 46, 40),
    noeyes: () => `<path d="M14 46 q22 -24 46 0 q-22 24 -46 0z" fill="#fff" stroke="${OUT}" stroke-width="${SW}" stroke-linejoin="round"/>
        <circle cx="37" cy="46" r="8" fill="#8A6A5A" stroke="${OUT}" stroke-width="2"/><circle cx="39" cy="43" r="2.4" fill="#fff"/>
        <path d="M18 36 l-5 -5 M27 30 l-2 -7 M38 28 l0 -7 M49 30 l3 -6" stroke="${OUT}" stroke-width="2" stroke-linecap="round"/>` +
        bubble(78, 40, 9) + bubble(94, 54, 6) + bubble(104, 34, 5) + noSign(60, 46, 40),
    clean: () => hand(18, 58, .78) + `<g transform="translate(120 0) scale(-1 1)">${hand(22, 58, .78)}</g>` + bubble(60, 30, 14, { face: true, eyes: 'closed' }) + sparkle(30, 22, 6) + sparkle(92, 18, 5, '#A9D4F5')
  };

  const ANIM = { blow: 'a-blow', pop: 'a-pop', float: 'a-float', fly: 'a-fly', catch: 'a-catch', mix: 'a-mix', dip: 'a-dip', water: 'a-drop', wash: 'a-drop', watch: 'a-bob', openbottle: 'a-cap' };
  BF.art = k => A[k] ? `<div class="art ${ANIM[k] || ''}"><svg viewBox="0 0 120 92" overflow="visible"><g filter="url(#bfWob)">${A[k]()}</g></svg></div>` : '';

  /* a single bubble for games / backgrounds */
  BF.bub = (color, o = {}) => `<svg viewBox="-3 -3 66 66" width="100%" height="100%" overflow="visible"><g filter="url(#bfWob)">${bubble(30, 30, 28, { color, face: !!o.face, eyes: o.eyes, mouth: o.mouth })}</g></svg>`;
  BF.COLORS = COL;

  /* ---------- UI icons ---------- */
  const IC = {
    star: `<path d="M12 2.5l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17l-5.6 2.9 1.1-6.3L2.9 9.2l6.3-.9z" fill="#F6D861" stroke="${OUT}" stroke-width="1.6" stroke-linejoin="round"/><circle cx="9.5" cy="12" r=".9" fill="${OUT}"/><circle cx="14.5" cy="12" r=".9" fill="${OUT}"/><path d="M10.8 14.2q1.2 1 2.4 0" fill="none" stroke="${OUT}" stroke-width="1" stroke-linecap="round"/>`,
    crown: `<path d="M3 18l-1-10 5.5 4.5L12 5l4.5 7.5L22 8l-1 10z" fill="#F6D861" stroke="${OUT}" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="13.5" r="1.6" fill="#F4A6BE" stroke="${OUT}" stroke-width="1"/><path d="M3 18h18" stroke="${OUT}" stroke-width="1.6"/>`,
    home: `<path d="M3.5 11L12 3.5l8.5 7.5" fill="none" stroke="${OUT}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v10h12V10" fill="#F9C9D6" stroke="${OUT}" stroke-width="1.6" stroke-linejoin="round"/><rect x="10" y="14" width="4" height="6" rx="1" fill="#fff" stroke="${OUT}" stroke-width="1.3"/>`,
    speaker: `<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="#C6E2F7" stroke="${OUT}" stroke-width="1.6" stroke-linejoin="round"/><path d="M15 9q2 3 0 6M17.6 7q3.6 5 0 10" fill="none" stroke="${OUT}" stroke-width="1.6" stroke-linecap="round"/>`,
    eyes: `<ellipse cx="7.5" cy="12" rx="4.3" ry="5.5" fill="#fff" stroke="${OUT}" stroke-width="1.5"/><ellipse cx="16.5" cy="12" rx="4.3" ry="5.5" fill="#fff" stroke="${OUT}" stroke-width="1.5"/><circle cx="8.3" cy="12.8" r="2.1" fill="${OUT}"/><circle cx="17.3" cy="12.8" r="2.1" fill="${OUT}"/>`,
    clock: `<circle cx="12" cy="13" r="8" fill="#FCEBB0" stroke="${OUT}" stroke-width="1.6"/><path d="M12 8.5V13l3 2" fill="none" stroke="${OUT}" stroke-width="1.6" stroke-linecap="round"/><path d="M9.5 3.5h5" stroke="${OUT}" stroke-width="1.8" stroke-linecap="round"/>`,
    printer: `<rect x="6.5" y="3.5" width="11" height="6" rx="1" fill="#fff" stroke="${OUT}" stroke-width="1.5"/><rect x="3" y="9" width="18" height="8" rx="2.5" fill="#DCD0F4" stroke="${OUT}" stroke-width="1.5"/><rect x="7" y="14" width="10" height="6.5" rx="1" fill="#fff" stroke="${OUT}" stroke-width="1.5"/>`,
    book: `<path d="M3 5.5q4.5-1.5 9 1 4.5-2.5 9-1v13q-4.5-1.5-9 1-4.5-2.5-9-1z" fill="#FCEBB0" stroke="${OUT}" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 6.5v13" stroke="${OUT}" stroke-width="1.4"/>`,
    game: `<rect x="2.5" y="7" width="19" height="11" rx="5.5" fill="#C6E2F7" stroke="${OUT}" stroke-width="1.5"/><path d="M7 10.5v4M5 12.5h4" stroke="${OUT}" stroke-width="1.5" stroke-linecap="round"/><circle cx="16" cy="11" r="1.2" fill="#F4A6BE"/><circle cx="18" cy="13.8" r="1.2" fill="#93CF96"/>`
  };
  BF.icon = (k, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>`;

  const MAP = { '⭐': 'star', '👑': 'crown', '🏠': 'home', '🔊': 'speaker', '👀': 'eyes', '⏱': 'clock', '🖨️': 'printer', '📖': 'book', '🎮': 'game' };
  const RE = new RegExp(Object.keys(MAP).join('|'), 'g');
  BF.iconize = (root = document.body) => {
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const nodes = []; while (w.nextNode()) if (RE.test(w.currentNode.nodeValue)) nodes.push(w.currentNode);
    nodes.forEach(n => {
      if (n.parentNode.closest && n.parentNode.closest('script,style')) return;
      const span = document.createElement('span');
      span.innerHTML = n.nodeValue.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])).replace(RE, m => BF.icon(MAP[m]));
      n.replaceWith(...span.childNodes);
    });
  };
  BF.stars = n => [0, 1, 2].map(i => BF.icon('star', i < n ? 'big' : 'big off')).join('');

  /* hand-drawn floating background bubbles */
  BF.bgBubbles = (n = 14) => {
    ensureDefs();
    const box = document.createElement('div'); box.className = 'bg-bubbles';
    const cols = [null, null, null, 'purple', 'blue', 'red'];
    for (let i = 0; i < n; i++) {
      const b = document.createElement('div'); const s = 26 + Math.random() * 64;
      b.className = 'bgb';
      b.style.width = b.style.height = s + 'px';
      b.style.left = Math.random() * 100 + '%';
      b.style.animationDuration = 14 + Math.random() * 16 + 's';
      b.style.animationDelay = -Math.random() * 30 + 's';
      const c = BF.pick(cols);
      b.innerHTML = BF.bub(c, { face: s > 60 && Math.random() < .6, eyes: 'closed' });
      box.appendChild(b);
    }
    document.body.prepend(box);
  };
})();

</script>
<script>
BF.bgBubbles(8);
const card = `
<div class="mcard">
  <div class="mhead"><h2>Bubble Mission!</h2><div class="name">Name: <span></span></div></div>
  <div class="tasks">
    <div class="t">${BF.art('blow')}<div><div class="en">1. Blow bubbles.</div><div class="zh">吹泡泡</div></div><span class="box"></span></div>
    <div class="t">${BF.art('bubble')}<div><div class="en">2. Count: <span class="blank"></span> bubbles</div><div class="zh">數數看，寫下數字</div></div><span class="box"></span></div>
    <div class="t">${BF.art('float')}<div><div class="en">3. I see <span class="blank"></span>.</div><div class="zh">說出（或畫出）你看到的顏色</div></div><span class="box"></span></div>
    <div class="t">${BF.art('catch')}<div><div class="en">4. Catch a bubble!</div><div class="zh">接住一個泡泡</div></div><span class="box"></span></div>
  </div>
</div>`;
document.getElementById('sheet').innerHTML = card + card;
BF.iconize();
</script>
</body>
</html>
